name: Code style

# Runs on pull requests, and on every push to main as the first stage of deploy.yml (workflow_call),
# so a lint failure on main blocks the deploy.
on:
  pull_request:
  workflow_call:

# A newer PR push cancels the older PR run; a run called from deploy.yml is never cancelled.
concurrency:
  group: code-style-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: back/pyproject.toml

      - name: Install dev dependencies
        run: uv sync --python 3.12

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check --diff .

  frontend:
    name: Frontend (eslint, prettier, tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

  infra:
    name: Infra (cfn-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Lint CloudFormation templates
        run: uvx cfn-lint --format parseable infra/*.yaml

  infra-tests:
    name: Infra tests (templates, Makefile deploy contract, workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      # GNU make 4.x here; the same suite also runs locally on macOS make 3.81.
      - name: Test
        run: uvx --with pyyaml pytest infra/tests -q

      - name: Lint tests
        run: |
          uvx ruff check --config back/pyproject.toml infra/tests
          uvx ruff format --check --config back/pyproject.toml infra/tests
