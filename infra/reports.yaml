AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - weekly meetings report. EventBridge Scheduler (every Monday 07:00 Kyiv) and
  `make report-now` send a message to an SQS queue with a dead-letter queue; report-builder (the backend
  image, another handler) reads Aurora and saves reports/<week>.csv to S3; the ObjectCreated event starts
  report-mailer, which emails the file through SES. Neither function calls the other. Neither runs in a
  VPC: the express-configuration Aurora has no VPC (see backend.yaml), so no gateway endpoint is needed.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.

  # --- report-builder (the backend image; the Makefile passes the image the backend runs now) ---
  ImageUri:
    Type: String
    Description: Backend image URI including tag.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: Must match the platform the image was built for.

  # --- Database (from `make aws-db`; the Makefile passes them) ---
  DbHost:
    Type: String
    Description: Writer endpoint of the Aurora cluster.
  DbResourceId:
    Type: String
    Description: The cluster's resource ID (cluster-...), which IAM database authentication is scoped to.
  DbUsername:
    Type: String
    Default: postgres
  DbName:
    Type: String
    Default: postgres

  # --- Schedule ---
  ScheduleExpression:
    Type: String
    Default: cron(0 7 ? * MON *)
    Description: When the report is built. rate(5 minutes) to test without waiting for Monday.
  ReportTimezone:
    Type: String
    Default: Europe/Kyiv
    Description: Time zone of the schedule and of the report's calendar weeks.
  FailWeek:
    Type: String
    Default: ""
    Description: Lab exercise only. The builder fails for this ISO week (e.g. 2026-W30), so its message lands in the DLQ.

  # --- Email (SES) ---
  Domain:
    Type: String
    Description: Domain the report is sent from (reports@<Domain>); verified with the DKIM records in the outputs.
  ReportRecipients:
    Type: String
    Description: >-
      Comma-separated addresses the report goes to. While SES is in the sandbox it only delivers to
      verified addresses; the first one is created here as an identity (AWS emails it a link to click).

  LogRetentionDays:
    Type: Number
    Default: 7

Resources:
  # =====================================================================
  # Storage
  # =====================================================================
  # Named explicitly: the mailer's invoke permission needs the bucket's ARN before the bucket exists
  # (the bucket's notification needs the permission), and !GetAtt Bucket.Arn would be a cycle.
  ReportsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: MailerInvokePermission
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      BucketName: !Sub ${ProjectName}-reports-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: delete-old-reports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 90
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt MailerFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv

  # =====================================================================
  # Queue: one entry point for the schedule, the Makefile and later the API
  # =====================================================================
  RequestDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      QueueName: !Sub ${ProjectName}-report-requests-dlq
      MessageRetentionPeriod: 1209600

  RequestQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      QueueName: !Sub ${ProjectName}-report-requests
      # 6 x the builder's 60 s timeout: a message must not become visible again (and start a second
      # builder on the same report) while the first attempt still runs.
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RequestDeadLetterQueue.Arn
        maxReceiveCount: 3

  # =====================================================================
  # Trigger 1: the schedule sends a command to the queue
  # =====================================================================
  SchedulerRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: send-report-request
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt RequestQueue.Arn

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub ${ProjectName}-weekly-report
      Description: Ask for last week's meetings report every Monday morning.
      ScheduleExpression: !Ref ScheduleExpression
      # Without it the cron runs in UTC and the report arrives at 9 or 10 depending on daylight saving.
      ScheduleExpressionTimezone: !Ref ReportTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt RequestQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # =====================================================================
  # Trigger 2: report-builder takes messages from the queue
  # =====================================================================
  BuilderLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      LogGroupName: !Sub /aws/lambda/${ProjectName}-report-builder
      RetentionInDays: !Ref LogRetentionDays

  # Database sign-in, writing reports, and reading its queue (the Lambda service polls SQS for it).
  BuilderRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: build-report
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUsername}
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt RequestQueue.Arn

  BuilderFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      FunctionName: !Sub ${ProjectName}-report-builder
      Description: Builds one week's meetings report and saves it to S3.
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      # Same image as the API (models, database code, build_weekly_report), another handler.
      ImageConfig:
        Command: ["app.reports.lambda_handler.handler"]
      Architectures: [!Ref Architecture]
      MemorySize: 512
      # Aurora may need ~15 s to resume from 0 ACU. The queue's visibility timeout is 6 x this.
      Timeout: 60
      Role: !GetAtt BuilderRole.Arn
      LoggingConfig:
        LogGroup: !Ref BuilderLogGroup
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: "5432"
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUsername
          DB_IAM_AUTH: "true"
          DB_NULL_POOL: "true"
          REPORTS_BUCKET: !Sub ${ProjectName}-reports-${AWS::AccountId}
          REPORT_TIMEZONE: !Ref ReportTimezone
          REPORT_FAIL_WEEK: !Ref FailWeek

  BuilderQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EventSourceArn: !GetAtt RequestQueue.Arn
      FunctionName: !Ref BuilderFunction
      BatchSize: 1
      Enabled: true

  # =====================================================================
  # Trigger 3: a new file in reports/ starts report-mailer
  # =====================================================================
  MailerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      LogGroupName: !Sub /aws/lambda/${ProjectName}-report-mailer
      RetentionInDays: !Ref LogRetentionDays

  # Reads reports and sends email. No s3:PutObject: a function started by uploads to reports/ that
  # uploaded to reports/ would start itself forever.
  MailerRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: mail-report
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*

  MailerFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      FunctionName: !Sub ${ProjectName}-report-mailer
      Description: Emails each new report in S3 through SES.
      Runtime: python3.12
      Handler: index.handler
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt MailerRole.Arn
      LoggingConfig:
        LogGroup: !Ref MailerLogGroup
      Environment:
        Variables:
          SENDER: !Sub reports@${Domain}
          RECIPIENTS: !Ref ReportRecipients
      Code:
        ZipFile: |
          """report-mailer: emails each reports/<week>.csv that appears in the bucket, as an attachment."""
          import logging
          import os
          import urllib.parse
          from email.message import EmailMessage

          import boto3

          log = logging.getLogger("report-mailer")
          log.setLevel(logging.INFO)
          s3 = boto3.client("s3")
          ses = boto3.client("sesv2")


          def handler(event, context):
              sent = []
              for record in event["Records"]:
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])
                  log.info("report-mailer triggered trigger=s3 event=%s key=%s", record["eventName"], key)
                  body = s3.get_object(Bucket=bucket, Key=key)["Body"].read()
                  name = key.rsplit("/", 1)[-1]
                  week = name.removesuffix(".csv")

                  msg = EmailMessage()
                  msg["Subject"] = f"Weekly meetings report {week}"
                  msg["From"] = os.environ["SENDER"]
                  msg["To"] = os.environ["RECIPIENTS"]
                  msg.set_content(f"The meetings report for {week} is attached.\n")
                  msg.add_attachment(body, maintype="text", subtype="csv", filename=name)

                  response = ses.send_email(Content={"Raw": {"Data": msg.as_bytes()}})
                  log.info("report emailed key=%s message_id=%s", key, response["MessageId"])
                  sent.append(response["MessageId"])
              return {"sent": sent}

  MailerInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref MailerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:s3:::${ProjectName}-reports-${AWS::AccountId}
      SourceAccount: !Ref AWS::AccountId

  # =====================================================================
  # SES: the sending domain (DKIM CNAMEs go to the DNS provider) and, for the sandbox, the recipient
  # =====================================================================
  DomainIdentity:
    Type: AWS::SES::EmailIdentity
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmailIdentity: !Ref Domain

  RecipientIdentity:
    Type: AWS::SES::EmailIdentity
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EmailIdentity: !Select [0, !Split [",", !Ref ReportRecipients]]

Outputs:
  BucketName:
    Value: !Ref ReportsBucket
  QueueUrl:
    Description: Where `make report-now` sends its message.
    Value: !Ref RequestQueue
  DeadLetterQueueUrl:
    Value: !Ref RequestDeadLetterQueue
  BuilderFunctionName:
    Value: !Ref BuilderFunction
  MailerFunctionName:
    Value: !Ref MailerFunction
  Sender:
    Value: !Sub reports@${Domain}
  DkimName1:
    Value: !GetAtt DomainIdentity.DkimDNSTokenName1
  DkimValue1:
    Value: !GetAtt DomainIdentity.DkimDNSTokenValue1
  DkimName2:
    Value: !GetAtt DomainIdentity.DkimDNSTokenName2
  DkimValue2:
    Value: !GetAtt DomainIdentity.DkimDNSTokenValue2
  DkimName3:
    Value: !GetAtt DomainIdentity.DkimDNSTokenName3
  DkimValue3:
    Value: !GetAtt DomainIdentity.DkimDNSTokenValue3
