AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - Paste an agenda. The agenda-parser Lambda (the backend image, another handler) takes
  pasted text on a public, Cognito-authenticated function URL, asks Claude on Amazon Bedrock for a
  structured agenda, validates it and returns JSON. It runs outside any VPC (no database, no NAT, no
  VPC endpoint) and never writes: the browser saves the checked agenda through the main API. Plus a
  $5 monthly AWS Budgets alarm.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.

  # --- agenda-parser (the backend image; the Makefile passes the image the backend runs now) ---
  ImageUri:
    Type: String
    Description: Backend image URI including tag.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: Must match the platform the image was built for.
  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Bedrock model ID of the Claude model that parses agendas (PARSER_MODEL).

  # --- Who may call it (from the Cognito stack and the frontend stack; the Makefile passes them) ---
  CognitoUserPoolId:
    Type: String
    AllowedPattern: ".+"
    Description: User pool whose ID tokens the parser accepts. Required - every parse costs money.
  CognitoClientId:
    Type: String
    AllowedPattern: ".+"
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: Browser origins allowed to call the function URL (the site's and the local dev servers).

  # --- Cost alarm ---
  BudgetEmail:
    Type: String
    AllowedPattern: ".+@.+"
    Description: Who gets the budget alarm.
  BudgetLimitUsd:
    Type: Number
    Default: 5
    Description: Monthly cost of the whole account that triggers the alarm.

  LogRetentionDays:
    Type: Number
    Default: 7

Resources:
  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      LogGroupName: !Sub /aws/lambda/${ProjectName}-agenda-parser
      RetentionInDays: !Ref LogRetentionDays

  # Logs and Bedrock, nothing else: no database, no S3, no other AWS service.
  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: call-claude
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # "*" for now, as the lab says: any model, any inference profile. Narrowing it is a
              # discussion question (docs/adr/0006-llm-agenda-parsing.md).
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: "*"

  ParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      FunctionName: !Sub ${ProjectName}-agenda-parser
      Description: Parses pasted text into a suggested meeting agenda with Claude on Bedrock.
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      # Same image as the API (the agenda schema, the Cognito token check), another handler.
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Architectures: [!Ref Architecture]
      MemorySize: 512
      # A parse takes 2-8 s; the SDK's own timeout (25 s) fires first.
      Timeout: 30
      # No VpcConfig: the function needs Bedrock and Cognito's JWKS over the internet, never Aurora.
      Role: !GetAtt ParserRole.Arn
      LoggingConfig:
        LogGroup: !Ref ParserLogGroup
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId

  # Public URL; the handler checks the Cognito ID token on every call and rejects the rest with 401.
  ParserFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ParserFunction
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 300

  # A public function URL needs both permissions (as the API's in backend.yaml).
  ParserFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # The whole account's actual cost this month; an email when it passes the limit, and one when the
  # forecast says it will.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${ProjectName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
      ResourceTags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  ParserUrl:
    Description: The frontend's VITE_PARSER_URL.
    Value: !GetAtt ParserFunctionUrl.FunctionUrl
  ParserFunctionName:
    Value: !Ref ParserFunction
  LogGroupName:
    Value: !Ref ParserLogGroup
