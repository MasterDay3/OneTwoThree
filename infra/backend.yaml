AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - backend on AWS Lambda (container image) behind a public function URL. The database is
  an Aurora Serverless v2 cluster created with express configuration by `make aws-db` (CloudFormation
  can't create those): no VPC, reached through its internet access gateway with IAM tokens only.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.

  # --- Backend (Lambda) ---
  ImageUri:
    Type: String
    Description: Full backend image URI including tag, e.g. <account>.dkr.ecr.<region>.amazonaws.com/meetings-backend:abc123.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: Must match the platform the image was built for. arm64 (Graviton) is ~20% cheaper.
  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Lambda memory in MB (CPU scales with it).
  Timeout:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 900
    Description: >-
      Seconds per request. Leave room for Aurora to resume from 0 ACU (about 15 s) on the first request.
  CorsOrigins:
    Type: String
    Default: http://localhost:3000,http://localhost:5173
    Description: Comma-separated browser origins allowed to call the API (the Makefile adds the frontend's).
  Seed:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Insert sample participants when migrations run and the table is empty.
  LogRetentionDays:
    Type: Number
    Default: 7

  # --- Auth (from the Cognito stack; the Makefile passes them) ---
  CognitoUserPoolId:
    Type: String
    Description: User pool whose ID tokens the API accepts.
  CognitoClientId:
    Type: String
    Description: App client the tokens must be issued to (their aud claim).
  CognitoJwks:
    Type: String
    Description: >-
      The pool's public signing keys (JWKS JSON). Passed in so requests never wait on downloading
      them; Cognito does not rotate user pool keys.

  # --- Database (from `make aws-db`; the Makefile passes them) ---
  DbHost:
    Type: String
    Description: Writer endpoint of the Aurora cluster.
  DbResourceId:
    Type: String
    Description: The cluster's resource ID (cluster-...), which IAM database authentication is scoped to.
  DbUsername:
    Type: String
    Default: postgres
    Description: Master user; express configuration signs it in with IAM tokens only.
  DbName:
    Type: String
    Default: postgres
    Description: Database the app uses (express configuration creates only the default one).

Resources:
  # =====================================================================
  # Lambda
  # =====================================================================
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      LogGroupName: !Sub /aws/lambda/${ProjectName}-backend
      RetentionInDays: !Ref LogRetentionDays

  # Logs, plus signing in to the database as DbUsername with IAM tokens. Cognito tokens are verified
  # with the JWKS from the environment, without calling Cognito.
  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: database-connect
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: rds-db:connect
                Resource: !Sub arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUsername}

  BackendFunction:
    Type: AWS::Lambda::Function
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      FunctionName: !Sub ${ProjectName}-backend
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [!Ref Architecture]
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      Role: !GetAtt BackendRole.Arn
      LoggingConfig:
        LogGroup: !Ref BackendLogGroup
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: "5432"
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUsername
          DB_IAM_AUTH: "true"
          # Close connections after each request: Aurora pauses only when none are open.
          DB_NULL_POOL: "true"
          CORS_ORIGINS: !Ref CorsOrigins
          SEED: !Ref Seed
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS: !Ref CognitoJwks

  # Public HTTPS endpoint of the function; this is the backend URL the frontend is built with.
  BackendFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref BackendFunction
      AuthType: NONE

  # A public function URL needs both permissions.
  BackendFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  BackendFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: Backend base URL (Lambda function URL); API routes live under /api.
    Value: !GetAtt BackendFunctionUrl.FunctionUrl
  ApiDocsUrl:
    Description: Swagger UI of the deployed backend.
    Value: !Sub "${BackendFunctionUrl.FunctionUrl}api/docs"
  FunctionName:
    Value: !Ref BackendFunction
  LogGroupName:
    Value: !Ref BackendLogGroup
  DbEndpoint:
    Description: Aurora writer endpoint (internet access gateway, IAM authentication).
    Value: !Ref DbHost
