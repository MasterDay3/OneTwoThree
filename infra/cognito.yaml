AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - Cognito user pool for sign-in with email and password (self sign-up, email
  verification), a public app client for the SPA, a Hosted UI domain for OAuth, and Google as an
  optional identity provider that is created only when GoogleClientId is set.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.
  CallbackUrls:
    Type: CommaDelimitedList
    Default: http://localhost:3000/auth/callback,http://localhost:5173/auth/callback
    Description: Where the Hosted UI may send users back after Google sign-in (the Makefile adds the site's).
  LogoutUrls:
    Type: CommaDelimitedList
    Default: http://localhost:3000/,http://localhost:5173/
    Description: Where the Hosted UI may send users after signing out.
  GoogleClientId:
    Type: String
    Default: ""
    Description: OAuth client ID from Google Cloud. Empty = Google sign-in is not set up.
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: OAuth client secret from Google Cloud (required with GoogleClientId).

Conditions:
  GoogleEnabled: !Not [!Equals [!Ref GoogleClientId, ""]]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${ProjectName}-users
      UserPoolTier: ESSENTIALS
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName
      # Users sign in with their email; Cognito sends a code to verify it on sign-up.
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      # Cognito's own sender (about 50 emails a day), enough until SES is set up.
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
        - { Name: name, AttributeDataType: String, Required: false, Mutable: true }

  # Hosted UI / OAuth endpoints, needed for federated sign-in (Google). The prefix must be unique
  # across AWS, hence the account ID.
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub ${ProjectName}-${AWS::AccountId}
      ManagedLoginVersion: 2

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: GoogleEnabled
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  # Public client (no secret): the browser talks to Cognito directly. The backend only verifies
  # the ID tokens it receives.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${ProjectName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days
      # Referencing the provider makes the client wait for it when Google is enabled.
      SupportedIdentityProviders: !If
        - GoogleEnabled
        - [COGNITO, !Ref GoogleIdentityProvider]
        - [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls

  # Without a style, a version 2 domain has no sign-in page to show.
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Region:
    Value: !Ref AWS::Region
  Issuer:
    Description: Issuer (iss) of the pool's tokens; its JWKS is at <Issuer>/.well-known/jwks.json.
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  HostedUiDomain:
    Description: Domain of the Hosted UI / OAuth endpoints.
    Value: !Sub ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  GoogleEnabled:
    Value: !If [GoogleEnabled, "true", "false"]
